name: Dogfood test placement
on:
  push:
    branches: [agent/dogfood-dev-opt-in]
    paths: [.github/workflows/dogfood-test-fix.yml]
permissions:
  contents: write
jobs:
  correct:
    if: github.repository == 'intendant-dev/Intendant' && github.ref == 'refs/heads/agent/dogfood-dev-opt-in'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Keep facade assertions within their module boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/bin/caller/builtin_skills.rs')
          text = path.read_text()
          old = '        let docs = crate::mcp::facade::render_docs(&serde_json::json!({}));\n        assert!(!docs.contains("intendant-dogfood"));\n'
          assert text.count(old) == 1
          path.write_text(text.replace(old, ''))
          path = Path('src/bin/caller/mcp/facade.rs')
          text = path.read_text()
          old = '        let list = render_docs(&serde_json::json!({}));\n'
          assert text.count(old) == 1
          new = old + '        assert!(!list.contains("intendant-dogfood"));\n' + '        assert!(render_docs(&serde_json::json!({ "skill": "intendant-dogfood" })).contains("unknown skill"));\n'
          path.write_text(text.replace(old, new))
          PY
          cargo fmt --all
          cargo fmt --all --check
          git diff --check
      - name: Commit the two-file test correction
        run: |
          git add src/bin/caller/builtin_skills.rs src/bin/caller/mcp/facade.rs
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: assert dogfood docs exclusion within the facade module'
          git push origin HEAD:agent/dogfood-dev-opt-in
