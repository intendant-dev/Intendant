name: macOS app release

# Builds, signs, notarizes, and publishes the native macOS app
# (the macos-app/ WKWebView wrapper bundling the release `intendant` +
# `intendant-runtime` binaries) via scripts/bundle-macos.sh.
#
# Triggers are version tags (v*) and manual dispatch ONLY — deliberately
# never pull_request or merge_group, so this workflow can never gate the
# merge queue. A red release run blocks a release, not landings.
#
# Signing secrets (repo Settings → Secrets and variables → Actions →
# Repository secrets). Two independent lanes:
#
# PGP (REQUIRED for tag releases — the alpha's distribution authenticity,
# owner-ratified lane D: detached signatures + the transparency log, no
# Apple Developer ID). A tag build without the pair goes red before
# building anything; a workflow_dispatch DRY-RUN without it still runs end
# to end and keeps only the explicitly UNSIGNED "-unsigned-dev" artifact
# on the workflow run. Secret names, exactly:
#
#   PGP_SIGN_KEY_B64         base64 of the ASCII-armored SECRET SIGNING
#                            SUBKEY export of the release key
#                            (gpg --export-secret-subkeys), passphrase-
#                            protected; the primary key never enters CI
#   PGP_SIGN_KEY_PASSPHRASE  passphrase protecting that export
#
# The public half is committed at the repo root (RELEASE-SIGNING-KEY.asc),
# published byte-identical beside every release, and pinned at compile
# time by `intendant hosted-verify` (src/bin/caller/pgp_identity.rs); the
# sign step self-verifies every signature against the COMMITTED key, so a
# CI key that is not the committed key's signing subkey fails the run.
#
# Apple Developer ID + notarization (OPTIONAL — a deliberately parked
# lane, dormant until its secrets are provisioned; the owner may elect it
# later). When absent, a tag release publishes the PGP-signed
# "-unsigned-dev" app archive and says so honestly in its notes. When
# configured it must be COMPLETE on a tag (signed AND notarized) or the
# run goes red. Secret names, exactly:
#
#   MACOS_SIGN_P12_B64       base64 of a "Developer ID Application" identity
#                            exported as .p12 — export WITH the certificate
#                            chain included, or identity validation fails
#   MACOS_SIGN_P12_PASSWORD  password protecting that .p12
#   NOTARY_KEY_B64           base64 of an App Store Connect API private key (.p8)
#   NOTARY_KEY_ID            Key ID of that API key
#   NOTARY_ISSUER_ID         Issuer ID of the API-keys page
#
# Each group is all-or-nothing; a partially configured group fails the run
# rather than silently shipping a less-signed artifact. Provisioning
# ceremonies (exporting the subkey from the escrow, exporting the p12,
# minting the notary key) and the user-facing verify ritual:
# docs/src/getting-started.md, "macOS releases: signing and notarization"
# / "Verifying a release". Local end-to-end rehearsal of the PGP lane
# (sign → log → verify, no tag or fleet): scripts/release-pgp-dryrun.sh.
#
# The cross-platform install scripts (scripts/install.sh, install.ps1)
# also ship as release assets: tag builds stamp them with the release
# identity (tag + commit) so each published installer prints what it is
# and fail-closes unless the tree it checks out matches — the canonical
# documented install one-liner fetches install.sh from the release, not
# from a hosted service.
#
# Release transparency (docs/src/self-hosted-rendezvous.md, "Release
# transparency"): after publishing, tag builds commit the released
# artifacts' hashes — the app bundle and the install scripts alike — to
# the rendezvous's public transparency log. One more repo secret, exactly:
#
#   CONNECT_RELEASE_TOKEN    bearer token the rendezvous was started with
#                            (--release-token / INTENDANT_CONNECT_RELEASE_TOKEN
#                            on intendant-connect) — authorizes ONLY
#                            release-manifest submission, nothing else
#
# The submission step only runs on tag builds, and a missing token FAILS
# the run there — a published-but-unlogged release is exactly the failure
# the log exists to prevent. Forks and dry-runs exercise the pipeline via
# workflow_dispatch, which never reaches the publish/submit steps. The
# optional CONNECT_RELEASE_URL repo *variable* points self-hosted forks at
# their own rendezvous (default https://intendant.dev).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # gh release create / upload

# One release build at a time per ref; never cancel a half-published release.
concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-app:
    name: macos-app
    # Tags and manual dispatch only exist on trusted refs, so this always
    # runs on the fleet Mac (same label windows.yml places its macOS leg on);
    # there is no fork-PR path to route to hosted runners.
    runs-on: [self-hosted, intendant-macos]
    timeout-minutes: 120
    steps:
      # Same fleet preflight as windows.yml: a nearly-full disk produces
      # resource-kill compile failures with useless diagnostics.
      - name: Fleet preflight
        shell: bash
        run: |
          avail_kb=$(df -Pk . | awk 'NR==2 {print $4}')
          avail_gb=$((avail_kb / 1024 / 1024))
          echo "disk available: ${avail_gb}G"
          if [ "$avail_gb" -lt 20 ]; then
            echo "::error::fleet preflight: only ${avail_gb}G free on this runner — below the 20G floor. Reclaim disk (merged worktrees' target/ dirs are the usual culprits) and rerun."
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # This short-lived operations branch exists only to drive a
          # manual artifact build; compile the landed tree, not this
          # workflow-only commit.
          ref: main
          # The default persisted token grants every later step push access;
          # nothing in these jobs pushes.
          persist-credentials: false
          # Full history so dev builds (workflow_dispatch off a branch) can
          # stamp a `git describe --tags` version.
          fetch-depth: 0

      # One version, everywhere: the binaries and Agent Card report
      # CARGO_PKG_VERSION, the app bundle stamps the tag, and the release
      # manifest strips the tag's "v" — so a tag that disagrees with
      # Cargo.toml would publish artifacts that misreport their own
      # identity. Fail before building anything.
      - name: Version identity gate
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"]=="intendant"))')"
          if [ "v$version" != "$tag" ]; then
            echo "::error::Version identity: Cargo.toml says $version but the tag is $tag. The tag, binaries, Agent Card, app bundle, and release manifest must agree — bump the version (and Cargo.lock) first, then re-tag."
            exit 1
          fi
          echo "version identity OK: $tag matches Cargo.toml $version"

      - name: Gate on signing secrets
        id: gate
        shell: bash
        env:
          P12_B64: ${{ secrets.MACOS_SIGN_P12_B64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          NOTARY_KEY_B64: ${{ secrets.NOTARY_KEY_B64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          PGP_KEY_B64: ${{ secrets.PGP_SIGN_KEY_B64 }}
          PGP_PASSPHRASE: ${{ secrets.PGP_SIGN_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          pgp_set=0
          [ -n "$PGP_KEY_B64" ] && pgp_set=$((pgp_set + 1))
          [ -n "$PGP_PASSPHRASE" ] && pgp_set=$((pgp_set + 1))
          sign_set=0
          [ -n "$P12_B64" ] && sign_set=$((sign_set + 1))
          [ -n "$P12_PASSWORD" ] && sign_set=$((sign_set + 1))
          notary_set=0
          [ -n "$NOTARY_KEY_B64" ] && notary_set=$((notary_set + 1))
          [ -n "$NOTARY_KEY_ID" ] && notary_set=$((notary_set + 1))
          [ -n "$NOTARY_ISSUER_ID" ] && notary_set=$((notary_set + 1))
          if [ "$pgp_set" = "1" ]; then
            echo "::error::Partial PGP config: set both PGP_SIGN_KEY_B64 and PGP_SIGN_KEY_PASSPHRASE, or neither."
            exit 1
          fi
          if [ "$sign_set" = "1" ]; then
            echo "::error::Partial signing config: set both MACOS_SIGN_P12_B64 and MACOS_SIGN_P12_PASSWORD, or neither."
            exit 1
          fi
          if [ "$notary_set" != "0" ] && [ "$notary_set" != "3" ]; then
            echo "::error::Partial notarization config: set all of NOTARY_KEY_B64, NOTARY_KEY_ID, NOTARY_ISSUER_ID, or none."
            exit 1
          fi
          if [ "$notary_set" = "3" ] && [ "$sign_set" = "0" ]; then
            echo "::error::Notarization secrets are set but the signing identity is not; Apple only notarizes Developer ID-signed bundles."
            exit 1
          fi
          pgp=false sign=false notarize=false
          [ "$pgp_set" = "2" ] && pgp=true
          [ "$sign_set" = "2" ] && sign=true
          [ "$notary_set" = "3" ] && notarize=true
          {
            echo "pgp=$pgp"
            echo "sign=$sign"
            echo "notarize=$notarize"
          } >> "$GITHUB_OUTPUT"
          echo "PGP: $pgp — Apple signing: $sign — notarization: $notarize"
          # Official releases fail closed on the PGP lane: a tag build must
          # detach-sign and log every artifact, or nothing is built or
          # published. Unsigned output stays available for
          # workflow_dispatch dry-runs only.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$pgp" != "true" ]; then
            echo "::error::Official tag releases must be PGP-signed — configure PGP_SIGN_KEY_B64 and PGP_SIGN_KEY_PASSPHRASE (escrow: the release-signing README), or dry-run the pipeline via workflow_dispatch instead."
            exit 1
          fi
          # The Apple lane is optional (dormant until provisioned), but an
          # ENGAGED Apple lane on a tag must be complete: a
          # signed-but-unnotarized official artifact is exactly the
          # half-trust this gate refuses to mint.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$sign" = "true" ] && [ "$notarize" != "true" ]; then
            echo "::error::The Apple signing identity is configured but notarization is not — an official tag build engages the Apple lane fully (sign AND notarize) or not at all."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$sign" != "true" ]; then
            echo "::warning::Apple lane dormant — this release publishes the PGP-signed, transparency-logged app archive with its explicit -unsigned-dev suffix (Gatekeeper will warn; the release notes say so)."
          fi
          if [ "$pgp" = "false" ]; then
            echo "::warning::No PGP signing secrets configured — this dry-run produces an unsigned-dev artifact with no signatures."
          fi

      # Throwaway keychain: created fresh, added to the FRONT of the user
      # search list (codesign cannot find identities in a keychain outside
      # the search list — verified empirically; --keychain alone is not
      # enough), deleted and the original list restored in the always()
      # cleanup step below.
      - name: Import signing identity (throwaway keychain)
        if: steps.gate.outputs.sign == 'true'
        shell: bash
        env:
          P12_B64: ${{ secrets.MACOS_SIGN_P12_B64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/intendant-release.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          # A hard-cancelled previous run may have left one behind.
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          # Save the original search list (one absolute path per line) BEFORE
          # touching it; `security list-keychains -s` replaces the whole list.
          security list-keychains -d user | sed 's/^ *"//; s/"$//' > "$RUNNER_TEMP/keychain-list.orig"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          printf '%s' "$P12_B64" | base64 -d > "$RUNNER_TEMP/sign.p12"
          security import "$RUNNER_TEMP/sign.p12" -k "$KEYCHAIN" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/sign.p12"
          # Let codesign use the imported key without a GUI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" > /dev/null
          { echo "$KEYCHAIN"; cat "$RUNNER_TEMP/keychain-list.orig"; } | tr '\n' '\0' \
            | xargs -0 security list-keychains -d user -s
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No valid 'Developer ID Application' identity in the imported .p12. Re-export it from Keychain Access WITH the certificate chain included."
            security find-identity -p codesigning "$KEYCHAIN" || true
            exit 1
          fi
          echo "Imported identity: $IDENTITY"
          {
            echo "INTENDANT_SIGN_IDENTITY=$IDENTITY"
            echo "INTENDANT_SIGN_KEYCHAIN=$KEYCHAIN"
          } >> "$GITHUB_ENV"

      - name: Materialize notary API key
        if: steps.gate.outputs.notarize == 'true'
        shell: bash
        env:
          NOTARY_KEY_B64: ${{ secrets.NOTARY_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$NOTARY_KEY_B64" | base64 -d > "$RUNNER_TEMP/notary-key.p8"
          echo "INTENDANT_NOTARY_KEY_FILE=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      # Throwaway GNUPGHOME under RUNNER_TEMP: the secret signing subkey
      # exists only there and only for this run; the dedicated always()
      # cleanup step below kills its agent and removes it even when a
      # later step failed. The passphrase reaches gpg via a 0600 file and
      # loopback pinentry — never argv, never the log.
      - name: Import PGP release signing key (throwaway GNUPGHOME)
        if: github.ref_type == 'tag' && steps.gate.outputs.pgp == 'true'
        shell: bash
        env:
          PGP_KEY_B64: ${{ secrets.PGP_SIGN_KEY_B64 }}
          PGP_PASSPHRASE: ${{ secrets.PGP_SIGN_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          command -v gpg > /dev/null || { echo "::error::gnupg is not installed on this runner — install it (brew install gnupg) before releasing."; exit 1; }
          PGP_HOME="$RUNNER_TEMP/pgp-home"
          rm -rf "$PGP_HOME"
          mkdir -p "$PGP_HOME"
          chmod 700 "$PGP_HOME"
          echo "allow-loopback-pinentry" > "$PGP_HOME/gpg-agent.conf"
          printf '%s' "$PGP_KEY_B64" | base64 -d > "$RUNNER_TEMP/pgp-key.asc"
          gpg --batch --homedir "$PGP_HOME" --import "$RUNNER_TEMP/pgp-key.asc"
          rm -f "$RUNNER_TEMP/pgp-key.asc"
          printf '%s' "$PGP_PASSPHRASE" > "$RUNNER_TEMP/pgp-passphrase"
          {
            echo "PGP_SIGN_HOME=$PGP_HOME"
            echo "PGP_SIGN_PASSPHRASE_FILE=$RUNNER_TEMP/pgp-passphrase"
          } >> "$GITHUB_ENV"

      # Lockfile gate first (the bundle script's own cargo build is not
      # --locked); its build then reuses this compilation unchanged.
      - name: Build release binaries
        shell: bash
        run: cargo build --release --locked --bin intendant --bin intendant-runtime

      - name: Bundle, sign, notarize
        if: github.ref_type == 'tag'
        shell: bash
        env:
          INSTALL_APP: "0"
          INTENDANT_ARTIFACT_DIR: ${{ github.workspace }}/dist
          # Tag builds stamp the tag; dispatch builds fall back to the
          # script's `git describe` dev version.
          INTENDANT_APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          # The gate step guarantees these are either all present or all
          # empty; bundle-macos.sh treats empty as unset.
          INTENDANT_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          INTENDANT_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          rm -rf dist
          ./scripts/bundle-macos.sh
          ls -l dist

      - name: Stage raw binaries (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/intendant target/release/intendant-runtime dist/

      # Always remove the key material and restore the runner's keychain
      # state, even when a build/notarization step failed.
      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/sign.p12" "$RUNNER_TEMP/notary-key.p8"
          if [ -f "$RUNNER_TEMP/keychain-list.orig" ]; then
            tr '\n' '\0' < "$RUNNER_TEMP/keychain-list.orig" | xargs -0 security list-keychains -d user -s
            rm -f "$RUNNER_TEMP/keychain-list.orig"
          fi
          if [ -f "$RUNNER_TEMP/intendant-release.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/intendant-release.keychain-db" || true
          fi

      # The install scripts ship as release assets beside the app bundle:
      # staged into dist/ so the publish and transparency-log steps below
      # cover them exactly like the binaries (name + sha256 + size in the
      # logged release manifest). Tag builds stamp the release identity
      # into the scripts first — the stamped installer prints what it is
      # at start and fail-closes (RELEASE_PIN_MISMATCH) unless the tree it
      # checks out matches the stamped commit — and the stamping itself
      # fails closed when a sentinel line drifted (ui.rs pins the
      # sentinels in the merge queue; this is the release-time backstop).
      # Dispatch dry-runs stage the unstamped copies, exercising the same
      # staging without minting a release identity.
      - name: Stamp and stage release installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp scripts/install.sh scripts/install.ps1 dist/
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            python3 - "$GITHUB_REF_NAME" "$(git rev-parse HEAD)" <<'PY'
          import sys
          tag, commit = sys.argv[1], sys.argv[2]
          # install.sh is UTF-8 (section markers, em-dashes); install.ps1
          # must stay pure ASCII (the Windows PowerShell 5.1 BOM-less
          # ANSI-decode pin in ui.rs) and the strict decode enforces that
          # here too.
          stamps = {
              "dist/install.sh": ("utf-8", [
                  ('INSTALLER_RELEASE_TAG=""', f'INSTALLER_RELEASE_TAG="{tag}"'),
                  ('INSTALLER_RELEASE_COMMIT=""', f'INSTALLER_RELEASE_COMMIT="{commit}"'),
              ]),
              "dist/install.ps1": ("ascii", [
                  ('$InstallerReleaseTag = ""', f'$InstallerReleaseTag = "{tag}"'),
                  ('$InstallerReleaseCommit = ""', f'$InstallerReleaseCommit = "{commit}"'),
              ]),
          }
          for path, (encoding, pairs) in stamps.items():
              text = open(path, "rb").read().decode(encoding, errors="strict")
              for needle, replacement in pairs:
                  if text.count(needle) != 1:
                      sys.exit(f"stamp sentinel {needle!r} not found exactly once in {path}")
                  text = text.replace(needle, replacement)
              open(path, "wb").write(text.encode(encoding))
          PY
            echo "stamped installers with $GITHUB_REF_NAME @ $(git rev-parse HEAD)"
          fi
          (cd dist && shasum -a 256 install.sh > install.sh.sha256)
          (cd dist && shasum -a 256 install.ps1 > install.ps1.sha256)
          ls -l dist

      # Every artifact that will publish gets a detached armored signature
      # from the release signing subkey; the repo-committed public key is
      # staged beside them byte-identically; and every signature is
      # self-verified against THAT committed key before anything
      # publishes (scripts/release-pgp-sign.sh) — a run whose documented
      # verify ritual would fail can never ship. Runs on credentialed
      # dispatch dry-runs too; a credential-less dispatch skips it and
      # keeps only the explicitly -unsigned-dev artifact.
      - name: PGP-sign release artifacts
        if: github.ref_type == 'tag' && steps.gate.outputs.pgp == 'true'
        id: pgp_sign
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/release-pgp-sign.sh dist "$RUNNER_TEMP/pgp-fingerprint"
          echo "fingerprint=$(cat "$RUNNER_TEMP/pgp-fingerprint")" >> "$GITHUB_OUTPUT"
          ls -l dist

      # Runs in step order AFTER the signing use-site (the Apple cleanup
      # step above sits earlier because bundling is the last Apple
      # use-site); always(), so the subkey never outlives a failed run.
      - name: Clean up PGP signing material
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/pgp-home" ]; then
            gpgconf --homedir "$RUNNER_TEMP/pgp-home" --kill gpg-agent 2>/dev/null || true
            rm -rf "$RUNNER_TEMP/pgp-home"
          fi
          rm -f "$RUNNER_TEMP/pgp-key.asc" "$RUNNER_TEMP/pgp-passphrase"

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_SIGNED: ${{ steps.gate.outputs.sign }}
          PGP_FINGERPRINT: ${{ steps.pgp_sign.outputs.fingerprint }}
        run: |
          set -euo pipefail
          # Self-hosted runner PATH may not include Homebrew.
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v gh > /dev/null || { echo "::error::gh CLI not found on the runner"; exit 1; }
          tag="$GITHUB_REF_NAME"
          zip_file="$(ls dist/Intendant-*.zip)"
          # Belt and suspenders behind the signing gate. A half-Apple
          # artifact never publishes; with the Apple lane engaged, neither
          # does an unsigned one. With the Apple lane dormant (lane D),
          # the explicitly suffixed -unsigned-dev archive is the expected
          # artifact — PGP signatures and the transparency log carry its
          # authenticity, and the notes below say so.
          case "$zip_file" in
            *-signed-unnotarized.zip)
              echo "::error::Refusing to publish $(basename "$zip_file") for tag $tag — an Apple-signed official release must also be notarized; the signing gate should have failed this run."
              exit 1 ;;
            *-unsigned-dev.zip)
              if [ "$APPLE_SIGNED" = "true" ]; then
                echo "::error::Refusing to publish $(basename "$zip_file") for tag $tag — the Apple identity was configured but the bundle came out unsigned; investigate the bundle step before releasing."
                exit 1
              fi ;;
          esac
          # PGP belt and suspenders: every published artifact carries its
          # detached signature and the committed public key ships beside
          # them, or nothing publishes.
          incomplete=0
          for f in dist/*; do
            case "$f" in *.asc) continue ;; esac
            if [ ! -f "$f.asc" ]; then
              echo "::error::$(basename "$f") has no detached .asc signature — the PGP sign step should have produced it."
              incomplete=1
            fi
          done
          if [ ! -f "dist/RELEASE-SIGNING-KEY.asc" ]; then
            echo "::error::dist/ is missing RELEASE-SIGNING-KEY.asc — the PGP sign step stages the committed public key beside the artifacts."
            incomplete=1
          fi
          [ "$incomplete" = "0" ] || exit 1
          if [ "$APPLE_SIGNED" = "true" ]; then
            signing_note="Signed with a Developer ID certificate, notarized by Apple, and stapled — Gatekeeper opens it without warnings. Every asset additionally carries a detached PGP signature."
          else
            signing_note="This alpha is deliberately not Apple-signed (no Developer ID): the app archive keeps its explicit \`-unsigned-dev\` suffix and Gatekeeper will warn on first open. Authenticity rides the detached PGP signatures and the public transparency log — verify before opening."
          fi
          {
            echo "Native macOS app: the \`macos-app/\` WKWebView wrapper bundling the release \`intendant\` and \`intendant-runtime\` binaries (Apple Silicon)."
            echo
            echo "$signing_note"
            echo
            echo "**Install:** unzip, drag \`Intendant.app\` to /Applications, launch. The app spawns its own daemon and serves the dashboard; grant Screen Recording / Accessibility / Microphone when prompted."
            echo
            echo "**Install from source (macOS / Linux / Windows):** the release-pinned installer ships as the \`install.sh\` / \`install.ps1\` assets — stamped with this release's tag and commit, self-verifying (fails closed on a checkout that doesn't match), and hash-committed to the public transparency log:"
            echo '```'
            echo "curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/install.sh | sh"
            echo '```'
            echo
            echo "**Verify (PGP + transparency log):** every asset carries a detached \`.asc\` signature by the Intendant release signing key \`$PGP_FINGERPRINT\` — committed in-repo as \`RELEASE-SIGNING-KEY.asc\`, attached to this release, and pinned by \`intendant hosted-verify\`:"
            echo '```'
            echo "gpg --import RELEASE-SIGNING-KEY.asc"
            echo "gpg --verify $(basename "$zip_file").asc $(basename "$zip_file")"
            echo "intendant hosted-verify --releases $tag"
            echo '```'
            echo
            echo "**Checksums:**"
            echo '```'
            echo "shasum -a 256 -c $(basename "$zip_file").sha256"
            echo '```'
            echo
            echo '```'
            cat dist/*.sha256
            echo '```'
          } > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Intendant $tag" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      # Commit what was just published to the public transparency log:
      # sha256 + size of every artifact uploaded to the GitHub release,
      # POSTed as a release_manifest (docs/src/self-hosted-rendezvous.md,
      # "Release transparency"). `intendant hosted-verify --releases`
      # checks the two sides against each other out of band. Runs AFTER
      # the publish step so the log commits exactly the uploaded bytes;
      # if submission fails — including a missing CONNECT_RELEASE_TOKEN —
      # the run goes red so the operator notices a published-but-unlogged
      # release. Dry-runs exercise the pipeline via workflow_dispatch,
      # which never reaches this step.
      - name: Submit release manifest to the transparency log
        if: github.ref_type == 'tag'
        shell: bash
        env:
          CONNECT_RELEASE_TOKEN: ${{ secrets.CONNECT_RELEASE_TOKEN }}
          CONNECT_RELEASE_URL: ${{ vars.CONNECT_RELEASE_URL || 'https://intendant.dev' }}
          RELEASE_TAG: ${{ github.ref_name }}
          PGP_FINGERPRINT: ${{ steps.pgp_sign.outputs.fingerprint }}
        run: |
          set -euo pipefail
          if [ -z "$CONNECT_RELEASE_TOKEN" ]; then
            echo "::error::CONNECT_RELEASE_TOKEN is not configured — an official tag release must commit its manifest to the transparency log (a published-but-unlogged release is the failure this gate exists to catch). Configure the secret, or dry-run without a tag via workflow_dispatch."
            exit 1
          fi
          # The signed artifacts, their .asc signatures, and the public
          # key asset all glob in; the log's submission gate refuses a
          # manifest with unsigned or stray entries, and pgp_fingerprint
          # commits WHICH key signed (the rendezvous validates it,
          # `intendant hosted-verify` pins it).
          manifest="$RUNNER_TEMP/release-manifest.json"
          python3 - "$RELEASE_TAG" dist/* > "$manifest" <<'PY'
          import hashlib, json, os, sys
          tag, *paths = sys.argv[1:]
          artifacts = []
          for path in sorted(paths, key=os.path.basename):
              digest = hashlib.sha256()
              with open(path, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1 << 20), b""):
                      digest.update(chunk)
              artifacts.append({
                  "name": os.path.basename(path),
                  "sha256": digest.hexdigest(),
                  "size": os.path.getsize(path),
              })
          fingerprint = os.environ.get("PGP_FINGERPRINT", "")
          if not fingerprint:
              sys.exit("PGP_FINGERPRINT is empty — the sign step did not run?")
          print(json.dumps({
              "tag": tag,
              "version": tag.removeprefix("v"),
              "platforms": ["macos-arm64"],
              "pgp_fingerprint": fingerprint,
              "artifacts": artifacts,
          }, indent=2))
          PY
          echo "release manifest for $RELEASE_TAG:"
          cat "$manifest"
          curl -sS --fail-with-body -X POST \
            "$CONNECT_RELEASE_URL/api/log/release-manifest" \
            -H "Authorization: Bearer $CONNECT_RELEASE_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$manifest"
          echo
          echo "release manifest committed to $CONNECT_RELEASE_URL/api/log/release-manifest"

      # Manual dispatch has no tag to hang a release on; keep the artifact
      # on the workflow run instead.
      - name: Upload workflow artifact (no tag)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intendant-macos-app
          path: dist/*
          if-no-files-found: error
