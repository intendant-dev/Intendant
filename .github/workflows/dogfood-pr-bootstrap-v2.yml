name: Dogfood PR bootstrap v2

on:
  push:
    branches:
      - agent/dogfood-report
    paths:
      - ".github/workflows/dogfood-pr-bootstrap-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/dogfood-report
      - name: Apply product slice from guarded bootstrap
        shell: python
        run: |
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/dogfood-pr-bootstrap.yml').read_text(encoding='utf-8')
          start = workflow.index('      - name: Apply dogfood report product slice\n')
          run = workflow.index('        run: |\n', start) + len('        run: |\n')
          end = workflow.index('      - name: Format\n', run)
          script = textwrap.dedent(workflow[run:end])

          old_block = '''# Dashboard fallback mirrors root's permission vocabulary.
          path = "static/app/42b-access-model.js"
          text = read(path)
          text = once(
              text,
              "'agenda.read', 'agenda.write', 'memory.read', 'memory.write'",
              "'agenda.read', 'agenda.write', 'feedback.write', 'memory.read', 'memory.write'",
              "dashboard fallback permission",
          )
          write(path, text)
          '''
          new_block = '''# Dashboard fallback mirrors root's permission vocabulary.
          path = "static/app/42b-access-model.js"
          text = read(path)
          old_permissions = "'agenda.read', 'agenda.write', 'memory.read', 'memory.write'"
          new_permissions = "'agenda.read', 'agenda.write', 'feedback.write', 'memory.read', 'memory.write'"
          root_start = text.index("function accessFallbackIamRoles() {")
          root_end = text.index("return [{", root_start)
          root_prefix = text[root_start:root_end]
          if root_prefix.count(old_permissions) != 1:
              raise SystemExit("dashboard root fallback permission vocabulary drifted")
          root_prefix = root_prefix.replace(old_permissions, new_permissions, 1)
          text = text[:root_start] + root_prefix + text[root_end:]
          write(path, text)
          '''
          if old_block not in script:
              raise SystemExit('bootstrap dashboard block drifted')
          script = script.replace(old_block, new_block, 1)
          # v2 owns cleanup of both temporary workflows.
          script = script.replace(
              'Path(".github/workflows/dogfood-pr-bootstrap.yml").unlink()',
              'Path(".github/workflows/dogfood-pr-bootstrap.yml").unlink()\nPath(".github/workflows/dogfood-pr-bootstrap-v2.yml").unlink()',
              1,
          )
          exec(compile(script, '<dogfood-bootstrap>', 'exec'), {'__name__': '__main__'})
      - name: Format
        run: cargo fmt --all
      - name: Targeted tests
        run: cargo test -p intendant dogfood
      - name: Commit product slice
        run: |
          git config user.name "Intendant dogfood bootstrap"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "mcp: add narrow dogfood feedback reporting"
          git push origin HEAD:agent/dogfood-report
