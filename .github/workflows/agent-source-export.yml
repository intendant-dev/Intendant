name: Agent source export

on:
  pull_request:
    paths:
      - ".github/workflows/agent-source-export.yml"

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/skills-over-mcp'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Pack source checkout
        run: tar --exclude=.git --exclude=target -czf /tmp/intendant-source.tar.gz .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intendant-source-${{ github.event.pull_request.head.sha }}
          path: /tmp/intendant-source.tar.gz
          if-no-files-found: error
          retention-days: 1
