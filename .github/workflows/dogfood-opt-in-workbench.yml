name: Dogfood opt-in workbench
on:
  push:
    branches: [agent/dogfood-dev-opt-in]
    paths: [.github/workflows/dogfood-opt-in-workbench.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'intendant-dev/Intendant' && github.ref == 'refs/heads/agent/dogfood-dev-opt-in'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Apply checksum-verified correction
        shell: bash
        run: |
          set -euo pipefail
          cat .dogfood-opt-in-patch.{0,1,2} | base64 --decode | gzip --decompress > /tmp/dogfood-opt-in.patch
          echo '07a56667ed0104fa48526a9334bc1fae32ce915ddda7a0b04ffb98ccaf908248  /tmp/dogfood-opt-in.patch' | sha256sum --check
          git apply --check /tmp/dogfood-opt-in.patch
          git apply /tmp/dogfood-opt-in.patch
      - name: Validate plugin packaging and relay
        run: |
          python3 -m unittest scripts/test_configure_intendant_plugin.py scripts/test_intendant_mcp_relay.py
          bash -n scripts/install-dev-skills.sh
      - name: Format and regenerate the dashboard canonically
        run: |
          cargo fmt --all
          cargo run -p app-html-assembler --locked
          git diff --check
      - name: Commit only this correction and remove temporary workbench
        shell: bash
        run: |
          set -euo pipefail
          rm .dogfood-opt-in-patch.{0,1,2} .github/workflows/dogfood-opt-in-workbench.yml
          git add -u
          git add scripts/test_configure_intendant_plugin.py
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make dogfood reporting developer-only and explicitly opt-in'
          git push origin HEAD:agent/dogfood-dev-opt-in
          git rev-parse HEAD > /tmp/dogfood-head.txt
      - name: Export validated source and result
        if: always()
        shell: bash
        run: |
          git diff --binary > /tmp/dogfood-remaining.diff
          git archive --format=tar.gz HEAD > /tmp/dogfood-validated-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dogfood-validated-source
          path: |
            /tmp/dogfood-validated-source.tar.gz
            /tmp/dogfood-head.txt
            /tmp/dogfood-remaining.diff
          retention-days: 1
