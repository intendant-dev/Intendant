name: Dogfood PR bootstrap

on:
  push:
    branches:
      - agent/dogfood-report
    paths:
      - ".github/workflows/dogfood-pr-bootstrap.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/dogfood-report
      - name: Apply dogfood report product slice
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          # --- Agenda: one lock covers dedupe decision + one durable op. ---
          path = "src/bin/caller/agenda/handle.rs"
          text = read(path)
          marker = "    /// Stamp an automation definition (Track AW): the graph-shaped twin\n"
          method = r'''    /// Exception-only product dogfood intake: decide create-vs-merge while
              /// holding the Agenda writer lock, then append exactly ONE validated op.
              /// The fingerprint is daemon-derived by the MCP report tool; callers cannot
              /// select an existing item id or gain generic agenda-write authority through
              /// this seam. Only OPEN feedback items dedupe — a repeated report after the
              /// owner completed/retired an item is a new occurrence worth re-triage.
              pub(crate) fn apply_dogfood_report(
                  &self,
                  fingerprint_tag: String,
                  title: String,
                  first_body: String,
                  occurrence: String,
                  tags: Vec<String>,
                  actor: Option<AgendaActor>,
              ) -> Result<serde_json::Value, AgendaError> {
                  let (mut item, counts, seq, status) = {
                      let mut store = self.lock();
                      store.refresh_if_stale()?;
                      let existing = store
                          .snapshot()
                          .into_iter()
                          .find(|item| {
                              item.status == super::types::AgendaStatus::Open
                                  && item.tags.iter().any(|tag| tag == "dogfood-feedback")
                                  && item.tags.iter().any(|tag| tag == &fingerprint_tag)
                          })
                          .map(|item| item.id);
                      let (cmd, status) = match existing {
                          Some(id) => (
                              AgendaCommand::Annotate {
                                  id,
                                  text: occurrence,
                                  source: Some("dogfood-report".to_string()),
                              },
                              "merged",
                          ),
                          None => (
                              AgendaCommand::Add {
                                  kind: super::types::AgendaKind::Note,
                                  title,
                                  body: first_body,
                                  tags,
                                  due_ms: None,
                                  source: Some("dogfood-report".to_string()),
                                  refs: Vec::new(),
                              },
                              "created",
                          ),
                      };
                      let item = store.apply_command(cmd, actor, now_ms())?;
                      let counts = store.counts();
                      let seq = broadcast_seq(&store, &item.id);
                      (item, counts, seq, status)
                  };
                  self.decorate_item(&mut item);
                  let occurrences = item.annotations.len().saturating_add(1);
                  self.bus.send(AppEvent::AgendaChanged {
                      item: item.clone(),
                      counts,
                      seq,
                  });
                  self.reminder_nudge.notify_waiters();
                  Ok(serde_json::json!({
                      "status": status,
                      "item_id": item.id,
                      "occurrences": occurrences,
                      "fingerprint": fingerprint_tag.strip_prefix("dogfood-fp-").unwrap_or(&fingerprint_tag),
                  }))
              }

          '''
          text = once(text, marker, method + marker, "Agenda dogfood method insertion")
          write(path, text)

          # --- MCP module wiring and fail-closed explicit dispatcher arm. ---
          path = "src/bin/caller/mcp/mod.rs"
          text = read(path)
          text = once(
              text,
              "mod tools_events;\nmod tools_terminal;",
              "mod tools_events;\nmod tools_feedback;\npub(crate) use tools_feedback::DogfoodReportParams;\nmod tools_terminal;",
              "MCP feedback module wiring",
          )
          text = once(
              text,
              '            "docs" => Ok(text_tool_result(facade::render_docs(&args))),\n            "events" => {',
              '''            "docs" => Ok(text_tool_result(facade::render_docs(&args))),
              "report" => {
                  let Parameters(params) = parse_params::<DogfoodReportParams>(args)?;
                  Ok(match self.report_dogfood_inner(params, &actor).await {
                      Ok(value) => text_tool_result(value.to_string()),
                      Err(message) => text_tool_error(format!("report failed: {message}")),
                  })
              }
              "events" => {''',
              "MCP report dispatcher",
          )
          write(path, text)

          # --- Facade: seventh tool, with a fixed narrow operation. ---
          path = "src/bin/caller/mcp/facade.rs"
          text = read(path)
          text = text.replace(
              "`tool_profile=facade` advertises five meta-tools — `inspect`, `act`, and\n//! `authorize` (risk-split argv executors), plus `help` and `docs` — whose",
              "`tool_profile=facade` advertises seven meta-tools — `inspect`, `act`, and\n//! `authorize` (risk-split argv executors), plus `help`, `docs`, `events`, and\n//! the narrow `report` dogfood intake — whose",
              1,
          )
          text = once(
              text,
              'pub(crate) const FACADE_TOOLS: [&str; 6] =\n    ["inspect", "act", "authorize", "help", "docs", "events"];',
              'pub(crate) const FACADE_TOOLS: [&str; 7] = [\n    "inspect", "act", "authorize", "help", "docs", "events", "report",\n];',
              "facade tool catalog",
          )
          text = once(
              text,
              '        "events" => Some(PeerOperation::SessionInspect),\n        "inspect" | "act" | "authorize" => Some(',
              '        "events" => Some(PeerOperation::SessionInspect),\n        // Dogfood reports are a narrow write class of their own: callers do\n        // not need agenda.write merely to report friction.\n        "report" => Some(PeerOperation::FeedbackWrite),\n        "inspect" | "act" | "authorize" => Some(',
              "facade gate report operation",
          )
          text = once(
              text,
              '        "events" => Some(allowed(PeerOperation::SessionInspect)),\n        "inspect" | "act" | "authorize" => Some(',
              '        "events" => Some(allowed(PeerOperation::SessionInspect)),\n        "report" => Some(allowed(PeerOperation::FeedbackWrite)),\n        "inspect" | "act" | "authorize" => Some(',
              "facade advertised report operation",
          )
          write(path, text)

          # --- IAM operation: feedback.write, separate from agenda.write. ---
          path = "src/bin/caller/access/access_policy.rs"
          text = read(path)
          text = once(
              text,
              "    /// Park, patch, and transition agenda items.\n    AgendaWrite,\n    /// Search and read Memory claims",
              "    /// Park, patch, and transition agenda items.\n    AgendaWrite,\n    /// Submit bounded, exception-only product dogfood feedback.\n    FeedbackWrite,\n    /// Search and read Memory claims",
              "FeedbackWrite enum variant",
          )
          text = once(text, "pub const ALL_OPERATIONS: [PeerOperation; 26]", "pub const ALL_OPERATIONS: [PeerOperation; 27]", "operation catalog length")
          text = once(
              text,
              "    PeerOperation::AgendaWrite,\n    PeerOperation::MemoryRead,",
              "    PeerOperation::AgendaWrite,\n    PeerOperation::FeedbackWrite,\n    PeerOperation::MemoryRead,",
              "operation catalog feedback row",
          )
          write(path, text)

          path = "src/bin/caller/access/iam.rs"
          text = read(path)
          # Root permission catalog is a hand-kept string list because it also
          # feeds the Access UI; keep the new permission visible there.
          match = re.search(r"fn root_permission_ids\(\) -> Vec<String> \{(?P<body>.*?)\n\}", text, re.S)
          if not match:
              raise SystemExit("root_permission_ids not found")
          body = match.group("body")
          if '"feedback.write"' not in body:
              body = body.replace('        "agenda.write",\n', '        "agenda.write",\n        "feedback.write",\n', 1)
              text = text[:match.start("body")] + body + text[match.end("body"):]
          text = once(
              text,
              '        PeerOperation::AgendaWrite => "agenda.write",\n        PeerOperation::MemoryRead => "memory.read",',
              '        PeerOperation::AgendaWrite => "agenda.write",\n        PeerOperation::FeedbackWrite => "feedback.write",\n        PeerOperation::MemoryRead => "memory.read",',
              "operation permission id",
          )
          text = once(
              text,
              '        "agenda.write" => "Agenda write",\n        "memory.read" => "Memory read",',
              '        "agenda.write" => "Agenda write",\n        "feedback.write" => "Dogfood feedback",\n        "memory.read" => "Memory read",',
              "permission label",
          )
          text = once(
              text,
              '        "agenda.write" => "Park, edit, complete, reopen, and retire agenda items.",\n        "memory.read" =>',
              '        "agenda.write" => "Park, edit, complete, reopen, and retire agenda items.",\n        "feedback.write" => "Submit bounded Intendant dogfood issues and efficiency recommendations; no generic agenda mutation authority.",\n        "memory.read" =>',
              "permission summary",
          )
          write(path, text)

          # Dashboard fallback mirrors root's permission vocabulary.
          path = "static/app/42b-access-model.js"
          text = read(path)
          text = once(
              text,
              "'agenda.read', 'agenda.write', 'memory.read', 'memory.write'",
              "'agenda.read', 'agenda.write', 'feedback.write', 'memory.read', 'memory.write'",
              "dashboard fallback permission",
          )
          write(path, text)

          # --- Tool listing, operation map, schema, and profile exposure. ---
          path = "src/bin/caller/mcp/tool_gate.rs"
          text = read(path)
          text = once(
              text,
              '                    | "notify_user"\n                    // Self-identity for provenance:',
              '                    | "notify_user"\n                    // Exception-only product feedback is a core collaboration\n                    // primitive with its own narrow feedback.write gate.\n                    | "report"\n                    // Self-identity for provenance:',
              "core profile report",
          )
          text = text.replace(
              "/// The CLI-shaped meta-tool surface (`mcp/facade.rs`): six tools,",
              "/// The CLI-shaped meta-tool surface (`mcp/facade.rs`): seven tools,",
              1,
          )
          text = once(
              text,
              '        "inspect" | "act" | "authorize" | "help" | "docs" | "events" => {\n            PeerOperation::RuntimeControl\n        }',
              '        "inspect" | "act" | "authorize" | "help" | "docs" | "events" => {\n            PeerOperation::RuntimeControl\n        }\n        // First-class dogfood intake: deliberately not agenda.write.\n        "report" => PeerOperation::FeedbackWrite,',
              "report operation map",
          )
          text = text.replace(
              "// listing is budget-pinned in tests (the point is that these five\n    // definitions replace dozens of typed schemas).",
              "// listing is budget-pinned in tests (the point is that these seven\n    // definitions replace dozens of typed schemas).",
              1,
          )
          report_def = '''    push(
              "report",
              manual_http_tool_definition!(
                  "report",
                  "Report one exceptional Intendant-specific issue or concrete efficiency opportunity. Do not report routine success or paste transcripts, prompts, environment dumps, tool arguments/output, credentials, or secrets. The daemon stamps trusted provenance/build metadata and atomically creates or merges the Agenda-backed report under the narrow feedback.write permission.",
                  DogfoodReportParams
              ),
          );
          '''
          needle = '''    push(
              "events",
              manual_http_tool_definition!(
          '''
          if text.count(needle) != 1:
              raise SystemExit(f"report definition insertion: expected one events push, found {text.count(needle)}")
          text = text.replace(needle, report_def + "\n" + needle, 1)
          text = text.replace(
              "/// The facade profile advertises exactly the five meta-tools, and the",
              "/// The facade profile advertises exactly the seven meta-tools, and the",
              1,
          )
          write(path, text)

          # --- Builtin skill + parity with the ChatGPT package copy. ---
          path = "src/bin/caller/builtin_skills.rs"
          text = read(path)
          row = '''    BuiltinSkill {
              name: "intendant-dogfood",
              skill_md: include_str!("../../../skills/intendant-dogfood/SKILL.md"),
              support_files: &[],
          },
          '''
          needle = '''    BuiltinSkill {
              name: "intendant-cli",
          '''
          if text.count(needle) != 1:
              raise SystemExit("builtin skill insertion point drifted")
          text = text.replace(needle, row + needle, 1)
          test_marker = '''    fn embedded(name: &str) -> &'static BuiltinSkill {
          '''
          parity_test = '''    #[test]
              fn chatgpt_dogfood_skill_matches_builtin() {
                  assert_eq!(
                      embedded("intendant-dogfood").skill_md,
                      include_str!(
                          "../../../examples/chatgpt-plugin/plugin-template/skills/intendant-dogfood/SKILL.md"
                      ),
                      "ChatGPT plugin dogfood teaching drifted from the shared builtin skill"
                  );
              }

          '''
          if text.count(test_marker) != 1:
              raise SystemExit("builtin test insertion point drifted")
          text = text.replace(test_marker, parity_test + test_marker, 1)
          write(path, text)

          # --- Product docs: seven-tool facade + narrow permission/provenance. ---
          path = "docs/src/mcp-server.md"
          text = read(path)
          text = text.replace(
              "`facade` advertises only the six meta-tools of the",
              "`facade` advertises only the seven meta-tools of the",
              1,
          )
          text = text.replace(
              "`tool_profile=facade` is the context-efficient control surface: instead of a\ntyped schema per capability, it advertises six meta-tools and everything\nelse is discovered lazily.",
              "`tool_profile=facade` is the context-efficient control surface: instead of a\ntyped schema per capability, it advertises seven meta-tools and everything\nelse is discovered lazily.",
              1,
          )
          event_sentence = "`events` is the cursor long-poll over the daemon's\nsession/approval/task lifecycle stream"
          if event_sentence not in text:
              raise SystemExit("mcp-server events paragraph drifted")
          insert_after = "invalidated by a daemon restart (the error says so); the underlying ring\ningests only the lifecycle families the `session.inspect` read tools\nalready serve, so the stream is push semantics over existing authority,\nnever new authority — and delivery is session-scoped for agent-session\ncallers (a supervised backend on its session-bound token sees only its\nown session's events, sessionless events withheld, matching the scoped\napproval reads)."
          if insert_after not in text:
              raise SystemExit("mcp-server facade event paragraph drifted")
          report_doc = insert_after + "\n\n`report` is the exception-only dogfood intake. It accepts one bounded structured\nissue or efficiency opportunity, stamps the gate-resolved actor and daemon build\nout of band, derives its own dedupe fingerprint, and atomically creates or\nannotates an open Agenda-backed feedback item. It is authorized as\n`feedback.write`, deliberately not `agenda.write`: a client may be allowed to\nreport friction without receiving general ledger mutation authority. Routine\nsuccess is not feedback; callers must not attach transcripts, prompts,\nenvironment dumps, raw tool arguments/output, credentials, or secrets."
          text = text.replace(insert_after, report_doc, 1)
          write(path, text)

          path = "docs/src/chatgpt-plugin.md"
          text = read(path)
          anchor = "The tunnel does not weaken Intendant's call-time MCP authorization. The relay\nauthenticates as the local-process principal; configure Intendant IAM for that\nprincipal to the least role the private plugin needs."
          if anchor not in text:
              raise SystemExit("chatgpt security paragraph drifted")
          addition = anchor + "\n\nThe generated plugin also carries the `intendant-dogfood` skill. It teaches\nChatGPT/Codex to call the narrow `report` tool only for exceptional\nIntendant-specific friction or concrete efficiency opportunities, never for\nroutine success. Reports remain local and Agenda-backed; the feature does not\nopen GitHub issues or publish externally. The `report` call is gated by\n`feedback.write` rather than broad `agenda.write`. Because the Secure MCP relay\nauthenticates as the local-process principal, any `client_context` supplied by\nthe model is explicitly self-described; only gate-stamped actor provenance is\ntrusted."
          text = text.replace(anchor, addition, 1)
          write(path, text)

          path = "examples/chatgpt-plugin/README.md"
          text = read(path)
          anchor = "The generated directory contains `.app.json`; the template does not. Never add\na runtime API key, Intendant loopback token, or live tunnel profile to either\ndirectory."
          if anchor not in text:
              raise SystemExit("plugin README anchor drifted")
          text = text.replace(
              anchor,
              anchor + "\n\nThe package also includes the `intendant-dogfood` skill: it teaches the host to\nuse Intendant's narrow `report` tool for exceptional product friction and\nconcrete efficiency recommendations while keeping routine success silent.",
              1,
          )
          write(path, text)

          # Retire the old dev-only manual hub choreography in favor of the
          # productized tool, so dogfood signal does not split across inboxes.
          path = "skills-internal/skill-dogfood-feedback/SKILL.md"
          old = read(path)
          frontmatter_end = old.find("---\n", old.find("---\n") + 4)
          if frontmatter_end < 0:
              raise SystemExit("internal dogfood skill frontmatter missing")
          replacement = '''---
          name: skill-dogfood-feedback
          description: Dev-fleet overlay for Intendant skill QA — use the productized `report` MCP tool for exceptional shipped-skill friction or concrete efficiency opportunities. Never report routine success; the daemon deduplicates open reports and stamps trusted provenance. This internal skill adds only the dev-fleet trigger and examples; it no longer writes agenda hubs directly.
          compatibility: Dev machines only — symlinked by scripts/install-dev-skills.sh from a repo checkout, never embedded in the binary or installed for users. Requires a reachable Intendant daemon exposing the `report` tool.
          ---

          # Dogfood feedback on shipped Intendant skills

          The shipped skills are product surfaces. When a skill misleads you,
          lacks a verb/recipe you needed, forces a workaround, or creates a
          concrete avoidable-call/context cost, file one exception through
          Intendant's `report` MCP tool:

          - `kind`: `issue` for wrong/missing/confusing guidance, otherwise
            `efficiency` for a concrete lower-cost interface/recipe.
          - `surface`: `skill:<skill-name>`.
          - `summary`: one distinct friction/opportunity.
          - `details`: what the skill taught and what was actually needed.
          - `recommendation`: the smaller/correct recipe when known.
          - `evidence_ref`: only a short scrubbed opaque id when useful.

          Routine successful use is **not feedback**. Never paste prompts,
          transcripts, environment dumps, tool arguments/output, machine names,
          credentials, tokens, or secrets. The report tool owns dedupe and trusted
          actor/build provenance; do not create or search a feedback hub yourself.
          Feedback is evidence, not a fix or a publication: do not edit the shipped
          skill or create an external issue merely because you filed a report.
          '''
          write(path, replacement)

          # The bootstrap workflow is branch-local scaffolding, never part of
          # the PR diff.
          Path(".github/workflows/dogfood-pr-bootstrap.yml").unlink()

      - name: Format
        run: cargo fmt --all
      - name: Targeted tests
        run: cargo test -p intendant dogfood --lib --bins
      - name: Commit product slice
        run: |
          git config user.name "Intendant dogfood bootstrap"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "mcp: add narrow dogfood feedback reporting"
          git push origin HEAD:agent/dogfood-report
