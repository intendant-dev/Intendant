name: Dogfood PR finalize

on:
  push:
    branches:
      - agent/dogfood-report
    paths:
      - ".github/workflows/dogfood-pr-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/dogfood-report
      - name: Fix dogfood docs paragraph boundary
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/src/mcp-server.md")
          text = path.read_text(encoding="utf-8")
          old = "environment dumps, raw tool arguments/output, credentials, or secrets. A facade call is authorized as the **resolved** command's"
          new = "environment dumps, raw tool arguments/output, credentials, or secrets.\n\nA facade call is authorized as the **resolved** command's"
          if text.count(old) != 1:
              raise SystemExit(f"docs paragraph boundary matches: {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/dogfood-pr-finalize.yml").unlink()
      - name: Commit docs hygiene
        run: |
          git config user.name "Intendant dogfood bootstrap"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: separate dogfood report policy paragraph"
          git push origin HEAD:agent/dogfood-report
