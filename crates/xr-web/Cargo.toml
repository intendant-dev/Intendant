[package]
name = "xr-web"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# WebGL2 comes from web-sys (stable API surface). The WebXR types do NOT:
# web-sys only exposes them behind the unstable-APIs cfg, which would leak
# a RUSTFLAGS cfg into the canonical artifact builder and version-couple us
# to web-sys's XR coverage (XRMediaBinding and the Layers API are absent
# there entirely). The crate instead carries its own typed externs in
# `webxr_sys.rs` — exactly the surface we use, nothing more.
[dependencies.web-sys]
version = "0.3"
features = [
  "CanvasRenderingContext2d",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCanvasElement",
  "HtmlVideoElement",
  "ImageData",
  "Navigator",
  "Performance",
  "TextMetrics",
  "WebGl2RenderingContext",
  "WebGlBuffer",
  "WebGlFramebuffer",
  "WebGlProgram",
  "WebGlShader",
  "WebGlTexture",
  "WebGlUniformLocation",
  "WebGlVertexArrayObject",
  "Window",
  "console",
]
