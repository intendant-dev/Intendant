[package]
name = "intendant-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
presence-core = { path = "../presence-core" }
serde = { version = "1.0", features = ["derive"] }
# The session-dial vocabulary (DialConfig) rides AgentLaunchConfig, whose
# wire schema derives schemars; same major as the caller's.
schemars = "1"
# skills discovery walks the home skills dir.
dirs = "6"
serde_json = "1.0"
socket2 = "0.6"
# net.rs uses select! in non-test code; keep macros direct instead of
# relying on workspace or dev-dependency feature unification.
tokio = { version = "1.0", features = ["io-util", "macros", "net", "sync", "time"] }
# Safe cross-platform local network-interface enumeration.
if-addrs = "0.15"

[dev-dependencies]
# autonomy's approval-config tests parse TOML fixtures; frames' tests
# write registries into temp dirs.
toml = "0.8"
tempfile = "3"
# the listener rebind tests drive a real accept loop
tokio = { version = "1.0", features = ["io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }
