[package]
name = "station-web"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

# model (the app.html snapshot wire schema) is pure Rust, so native
# builds — `cargo test -p station-web` and full-workspace native
# compiles — need only serde (plus serde_json for its tests). The
# browser renderer stack below is wasm32-gated to match lib.rs's cfg
# gates: an unconditional wgpu dep dragged the native graphics backends
# (~71 packages — the DX12 stack on Windows) into every full-workspace
# native build, end-user installer builds included.
[dependencies]
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bytemuck = { version = "1", features = ["derive"] }
console_error_panic_hook = "0.1"
js-sys = "0.3"
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wgpu = "29"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
  "CanvasRenderingContext2d",
  "CanvasGradient",
  "DeviceOrientationEvent",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlVideoElement",
  "ImageData",
  "KeyboardEvent",
  "Performance",
  "PointerEvent",
  "TextMetrics",
  "WheelEvent",
  "Window",
  "console",
]
